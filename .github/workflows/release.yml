name: 构建并发布

on:
  push:
    # 推送 v1.0.0 这样的标签时：构建 exe 并自动发布 Release
    tags: ["v*"]
  # 也支持在 Actions 页面手动点“Run workflow”，只构建不发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: 写入版本号（打包时刻）
        run: python -c "import core.version as v; print(v.write_stamp())"

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean 提醒钟.spec

      - name: 发布 Release（附件为 dist 下的 exe）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 pwsh 上传：Git Bash 下中文文件名会被破坏成 default.exe
          $exe = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "dist 下未找到打包产物" }
          $OutputEncoding = [System.Text.UTF8Encoding]::new()
          gh release create $env:GITHUB_REF_NAME `
            --title "提醒钟 $env:GITHUB_REF_NAME" `
            --generate-notes `
            $exe.FullName

      - name: 上传构建产物（仅手动触发时）
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: 提醒钟-exe
          path: dist/*.exe
